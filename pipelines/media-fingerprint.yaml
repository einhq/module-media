# The fingerprints that find copies of a file: an SSCD descriptor for a picture and for each of a
# video's keyframes, a chromaprint for a recording (EMS `fingerprint.compute`). Its own family,
# `fingerprints`, so a folder that wants only renditions gets none.
name: media-fingerprint
description: Compute the fingerprints that find copies of a picture, video or recording

triggers:
  # A source whose container cannot be read at all — `exif-extract` writes the reason onto the
  # file node when ffprobe refuses it. Nothing downstream will ever get a frame out of it, so
  # three attempts of the same permanent answer only make a corrupt original look like a
  # pipeline that is failing. See @media/probe UNDECODABLE_ATTR.
  - on: media.metadata.extracted
    wants: fingerprints
    match:
      mimetype: ['image/*', 'video/*', 'audio/*']
    skipIfAttr: undecodable

  # Announced by `fingerprints-scan` for a file without `fingerprintedAt`. `compute-fingerprint`
  # marks a file whose prints are all there and fingerprints the others. The backfill priority
  # keeps it behind newly imported media.
  - on: media.fingerprints.stale
    wants: fingerprints
    skipIfAttr: undecodable
    priority: 5

steps:
  fingerprint:
    command: compute-fingerprint $NODE_PATH
    description: SSCD for image / video keyframes, chromaprint for audio
    pool: media
    kind: fingerprint
    priority: 30
    requires:
      cpu: 1

options:
  maxAttempts: 3
  priority: 10
